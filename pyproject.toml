[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "franco"
version = "0.5.1"
description = "Autonomous AI sales agent. Always Be Closing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gortex", email = "hello@gortex.ai" }]
keywords = ["sales", "ai-agent", "cold-email", "prospecting", "autonomous-agent", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
# Keep in sync with requirements.in (requirements.txt is its generated lock).
dependencies = [
    "pyyaml>=6.0.1,<7",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "playwright>=1.40,<2",
    "beautifulsoup4>=4.12.3,<5",
    "dnspython>=2.4.2,<3",
    "aiosmtplib>=5.1.3,<6",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.5,<3",
    "pytz>=2024.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://gortex.ai"
Repository = "https://github.com/GortexAI/franco"
Issues = "https://github.com/GortexAI/franco/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
]
# Only for scripts/record_demo.py, which re-records the README's dashboard GIF.
demo = [
    "pillow>=10",
]

[project.scripts]
franco = "franco.cli:main"

[tool.setuptools.packages.find]
include = ["franco*"]

# The dashboard's HTML/CSS/JS are real files served from disk, and its fonts
# are vendored so a local tool renders correctly with the network off.
[tool.setuptools.package-data]
franco = ["web/*", "web/fonts/*"]
