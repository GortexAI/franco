# Release: push a tag vX.Y.Z (matching [project].version in pyproject.toml).
#
#   1. check    the tag matches pyproject.toml and CHANGELOG.md has notes for it
#   2. build    sdist + wheel, `twine check`, full test suite, installed-wheel tests
#   3. pypi     publish to https://pypi.org/project/franco/ with trusted
#               publishing (no stored token) and PEP 740 attestations
#   4. release  GitHub Release with those notes, the built files attached and
#               build-provenance attestations (only after PyPI accepted them)
#
# The container image for the same tag is published by docker.yml.
# How to cut a release: see "Releasing" in CONTRIBUTING.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The newest version the tests.yml matrix covers. Raise both together.
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Tag matches pyproject.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release_notes.py "${VERSION}" > release-notes.md

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Test suite
        run: |
          python -m pip install -e ".[dev]" "setuptools>=68" wheel
          python -m pytest -q

      - name: Installed-wheel test
        env:
          FRANCO_PACKAGE_TESTS: "1"
        run: python -m pytest -q tests/test_packaging.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts uploads only from this workflow, in
    # this environment, on this repository. Set up once on pypi.org (see
    # "Releasing" in CONTRIBUTING.md). The environment only allows v* tags.
    environment:
      name: pypi
      url: https://pypi.org/project/franco/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "${VERSION}" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) prerelease="--prerelease" ;; esac
          gh release create "${TAG}" dist/* \
            --repo "${REPO}" \
            --verify-tag \
            --title "Franco ${VERSION}" \
            --notes-file release-notes.md \
            ${prerelease}
