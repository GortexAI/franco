# Release: push a tag vX.Y.Z (matching [project].version in pyproject.toml).
#
#   1. check    the tag matches pyproject.toml and CHANGELOG.md has notes for it
#   2. build    sdist + wheel, `twine check`, full test suite, installed-wheel test
#   3. release  GitHub Release with those notes, the built files attached and
#               build-provenance attestations
#
# The container image for the same tag is published by docker.yml.
# How to cut a release: see "Releasing" in CONTRIBUTING.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Tag matches pyproject.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release_notes.py "${VERSION}" > release-notes.md

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Test suite
        run: |
          python -m pip install -e ".[dev]" "setuptools>=68" wheel
          python -m pytest -q

      - name: Installed-wheel test
        env:
          FRANCO_PACKAGE_TESTS: "1"
        run: python -m pytest -q tests/test_packaging.py

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "${VERSION}" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) prerelease="--prerelease" ;; esac
          gh release create "${TAG}" dist/* \
            --repo "${REPO}" \
            --verify-tag \
            --title "Franco ${VERSION}" \
            --notes-file release-notes.md \
            ${prerelease}
