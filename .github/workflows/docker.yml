# Container image: ghcr.io/gortexai/franco
#
#   pull request   build for linux/amd64 and smoke-test it; nothing is pushed
#   push to main   publish :edge and :sha-<commit> (linux/amd64 + linux/arm64)
#   tag vX.Y.Z     publish :X.Y.Z, :X.Y and :latest
#
# Every published image gets a signed build-provenance attestation and an SBOM:
#   gh attestation verify oci://ghcr.io/gortexai/franco:latest --owner GortexAI
name: docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - franco/**
      - prompts/**
      - skills/**
      - franco.yaml
      - .github/workflows/docker.yml
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/gortexai/franco   # registry paths must be lowercase

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Franco
            org.opencontainers.image.description=Outbound sales agent that runs on your Claude Code or Codex subscription
            org.opencontainers.image.vendor=Gortex
            org.opencontainers.image.licenses=MIT

      # Pull requests: one platform, loaded locally so it can be smoke-tested.
      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: franco:pr
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (pull request)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint python franco:pr -c "
          import franco.cli, franco.main, franco.dashboard, playwright
          from franco.config import load_config
          print('ok, outreach mode:', load_config().outreach.mode)"
          docker run --rm --entrypoint python franco:pr -m franco --help > /dev/null
          docker run --rm --entrypoint claude franco:pr --version

      # main and tags: both platforms, pushed with provenance and an SBOM.
      - name: Build and push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the published image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker run --rm --entrypoint python "${IMAGE}@${DIGEST}" -c "
          import franco.cli, franco.main, franco.dashboard, playwright
          from franco.config import load_config
          print('ok, outreach mode:', load_config().outreach.mode)"
          docker run --rm --entrypoint claude "${IMAGE}@${DIGEST}" --version
