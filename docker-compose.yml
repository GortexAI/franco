services:
  franco:
    # Published by .github/workflows/docker.yml. `docker compose pull` fetches
    # it; `docker compose up --build` builds this checkout instead. Use
    # FRANCO_TAG=edge for the latest main, or a version such as 0.4.0.
    image: ghcr.io/gortexai/franco:${FRANCO_TAG:-latest}
    build: .
    env_file: .env
    volumes:
      # Persist database across restarts
      - ./data:/app/data
      # Mount config for easy editing without rebuild
      - ./franco.yaml:/app/franco.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills
      # Mount Claude auth (required for Max plan usage).
      # Not read-only: the CLI refreshes OAuth tokens in place.
      # The container runs as non-root user "franco" (uid 1000).
      - ~/.claude:/home/franco/.claude
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
